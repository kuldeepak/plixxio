# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "a86755efde861aed7ee79eb603a9a66a"
name = "plixxo-app"
application_url = "https://plixxo.droplify.de"
embedded = true

[webhooks]
api_version = "2026-04"

[[webhooks.subscriptions]]
  topics = [ "products/update" ]
  uri = "/webhooks/products-update"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_inventory,read_locations,read_publications,write_app_proxy,write_files,write_inventory,write_products,write_publications"

[auth]
redirect_urls = [ "https://plixxo.droplify.de/api/auth" ]

[app_proxy]
url = "https://plixxo.droplify.de/cartApi"
subpath = "cartApi"
prefix = "apps"

[build]
automatically_update_urls_on_dev = true